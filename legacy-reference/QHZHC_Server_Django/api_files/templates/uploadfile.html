<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据上传情况</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
          .centered-title {
        text-align: center;
    }
    </style>
</head>
<body>
    <h2 class="centered-title"> 数据传输情况</h2>
    <table>
        <thead>
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}  <!-- 跳过标题行，从第二行开始 -->
                <tr>
                    <td>{{ row.uploadfilename }}</td>
                    <td>{{ row.uploadtime }}</td>
                    <td>{{ row.explain }}</td>
                    <td>{{ row.explain }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
